{% if panels %}
<figure class="chart">
<svg viewBox="0 0 {{ width }} {{ height }}" role="img" aria-label="{{ label }}">
  {% for p in panels %}
  <text class="label name" x="{{ left }}" y="{{ p.title_y }}">{{ p.name }}</text>
  {% for line in p.lines %}{% if line.legend %}
  <line class="line {{ line.css }}" x1="{{ line.legend.x1|floatformat:1 }}" x2="{{ line.legend.x2|floatformat:1 }}" y1="{{ p.title_y|add:"-4" }}" y2="{{ p.title_y|add:"-4" }}"/>
  <circle class="dot {{ line.css }}" cx="{{ line.legend.dot|floatformat:1 }}" cy="{{ p.title_y|add:"-4" }}" r="4"/>
  <text class="label" x="{{ line.legend.text_x|floatformat:1 }}" y="{{ p.title_y }}">{{ line.name }}</text>
  {% endif %}{% endfor %}
  {% for t in p.ticks %}
  <line class="grid" x1="{{ left }}" x2="{{ right_edge }}" y1="{{ t.y|floatformat:1 }}" y2="{{ t.y|floatformat:1 }}"/>
  <text x="{{ left|add:"-8" }}" y="{{ t.y|floatformat:1 }}" dy="4" text-anchor="end">{{ t.text }}</text>
  {% endfor %}
  <line class="axis" x1="{{ left }}" x2="{{ right_edge }}" y1="{{ p.base|floatformat:1 }}" y2="{{ p.base|floatformat:1 }}"/>
  {% for line in p.lines %}
  <path class="line {{ line.css }}" d="{{ line.path }}"/>
  {% endfor %}
  {% for line in p.lines %}{% for pt in line.points %}
  <a href="{{ pt.url }}"><circle class="dot {{ line.css }}" cx="{{ pt.x|floatformat:1 }}" cy="{{ pt.y|floatformat:1 }}" r="4"/><circle class="hit" cx="{{ pt.x|floatformat:1 }}" cy="{{ pt.y|floatformat:1 }}" r="9"><title>{{ pt.title }}</title></circle></a>
  {% endfor %}{% endfor %}
  {% for e in p.ends %}
  <text class="label value" x="{{ e.x|floatformat:1 }}" y="{{ e.y|floatformat:1 }}" dy="4">{{ e.text }}</text>
  {% endfor %}
  {% endfor %}
  {% for l in labels %}
  <text x="{{ l.x|floatformat:1 }}" y="{{ label_y }}" text-anchor="middle">{{ l.text }}</text>
  {% endfor %}
</svg>
<figcaption>{{ caption }}</figcaption>
</figure>
{% endif %}
