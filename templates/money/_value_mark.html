{# One valuation mark, a circle: faint grey for a club on a published list, blue for an expansion fee, orange for a sale. #}
<circle class="mark-{{ kind }}" cx="{{ cx|floatformat:1 }}" cy="{{ cy|floatformat:1 }}" r="{% if kind == 'club' %}2.5{% else %}5{% endif %}"{% if tip %} tabindex="0" role="button" data-tip="{{ tip }}"{% if href %} data-href="{{ href }}"{% endif %}><title>{{ tip }}</title></circle>{% else %}/>{% endif %}
